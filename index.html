<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPD System - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>MPD System</h1>
                <p>Metropolitan Police Department Management System</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="loginType">Login Type</label>
                    <select id="loginType" name="loginType" required>
                        <option value="">Select Login Type</option>
                        <option value="administrator">Administrator</option>
                        <option value="hq">MPD HQ</option>
                        <option value="hicomm">High Command</option>
                        <option value="unitcommand">Unit Command</option>
                        <option value="unitstaff">Unit Staff</option>
                        <option value="employee">Employee</option>
                    </select>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                <div id="loginError" class="error-message"></div>
            </form>
            
            <div class="demo-credentials">
                <h4>Demo Credentials:</h4>
                <p><strong>Admin:</strong> foet514 / Khamod21</p>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
